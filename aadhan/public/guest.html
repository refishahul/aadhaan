<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prayer Times</title>
  <meta name="theme-color" content="#0a3d3a" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="guest.css" />
</head>
<body>
  <div class="page">

    <header class="g-header">
      <img class="g-logo" src="/icons/icon-192.png" alt="Adhan Pi" />
      <div class="g-header-text">
        <div id="g-location" class="g-location"></div>
        <div id="g-date" class="g-date"></div>
      </div>
    </header>

    <section class="next-card">
      <div class="next-label">Next Prayer</div>
      <div id="g-next-name" class="next-name">—</div>
      <div id="g-next-time" class="next-time"></div>
      <div id="g-countdown" class="next-countdown">—</div>
    </section>

    <section class="times-section">
      <div class="times-grid" id="g-times-grid"></div>
    </section>

    <footer class="g-footer">Prayer times · <span id="g-method"></span></footer>
  </div>

  <script src="guest.js"></script>
</body>
</html>
